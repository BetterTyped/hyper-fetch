name: Workflow

on:
  push:
    branches:
      - main
      - beta
      - alpha
  pull_request:
    branches:
      - main
      - beta
      - alpha
  # Run this from the Actions tab to finish a release that stopped halfway.
  workflow_dispatch:

jobs:
  prepare-environment:
    name: Prepare environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.21.1"
          cache: "pnpm"
        env:
          FORCE_COLOR: 0
      - name: Install node_modules
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
      - name: Cache node_modules
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@v3
        with:
          path: |
            '**/node_modules'
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}

  tests:
    name: Run tests
    runs-on: ubuntu-latest
    needs: prepare-environment
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.21.1"
          cache: "pnpm"
      - name: Restore node_modules
        uses: actions/cache/restore@v3
        id: cache-node-modules
        with:
          path: |
            **/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
      - name: Install node_modules on cache miss
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test --coverage
      - name: Test release script
        run: pnpm test:release
      - name: Check examples
        run: pnpm test:examples && pnpm examples
      - name: Send Report
        uses: qltysh/qlty-action/coverage@v1
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: |
            ${{github.workspace}}/packages/adapter-axios/coverage/lcov.info:lcov
            ${{github.workspace}}/packages/adapter-graphql/coverage/lcov.info:lcov
            ${{github.workspace}}/packages/adapter-orpc/coverage/lcov.info:lcov
            ${{github.workspace}}/packages/adapter-trpc/coverage/lcov.info:lcov
            ${{github.workspace}}/packages/cli/coverage/lcov.info:lcov
            ${{github.workspace}}/packages/core/coverage/lcov.info:lcov
            ${{github.workspace}}/packages/plugin-devtools/coverage/lcov.info:lcov
            ${{github.workspace}}/packages/plugin-eslint/coverage/lcov.info:lcov
            ${{github.workspace}}/packages/plugin-oxlint/coverage/lcov.info:lcov
            ${{github.workspace}}/packages/react/coverage/lcov.info:lcov
            ${{github.workspace}}/packages/sockets/coverage/lcov.info:lcov

  release:
    name: Release
    if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta' || github.ref == 'refs/heads/alpha' }}
    runs-on: ubuntu-latest
    needs: [tests]
    # Releases of one branch run one at a time, and a running release is never cancelled.
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    # `released`: whether this run published anything — downstream automation (e.g. HyperFlow dispatch)
    # must gate on this; `flow-release.yml` does not re-check it (see comment block there).
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.21.1"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"
      - name: Restore node_modules
        uses: actions/cache/restore@v3
        id: cache-node-modules
        with:
          path: |
            **/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
      - name: Install node_modules on cache miss
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
      # Trusted publishing needs npm 11.5.1 or newer, and Node 22 ships with npm 10.
      - name: Install npm
        run: npm install --global npm@11.12.1
      # npm auth comes from trusted publishing (OIDC): the id-token permission above lets npm
      # exchange the Actions identity for a publish token. npm ties that trust to this workflow's
      # file name, so the release job has to stay in workflow.yml.
      # Requires the registry to be https://registry.npmjs.org/ (the .org host, exactly).
      # NPM_BOOTSTRAP_TOKEN is only used for the first publish of a brand new package.
      - name: Release
        id: release
        run: pnpm release
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_BOOTSTRAP_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
          NX_ISOLATE_PLUGINS: "false"
